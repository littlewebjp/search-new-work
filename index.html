<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6f1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>LATTE</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">本文へ</a>
  <section id="locked-screen" class="locked-screen" aria-labelledby="locked-title">
    <div class="locked-card">
      <p class="brand">LATTE<span aria-hidden="true">.</span></p>
      <h1 id="locked-title">専用リンクから<br>開いてください。</h1>
      <div class="locked-status" role="status" aria-live="polite"><h2 id="locked-status-title">あなたの記録を開きます</h2><p id="locked-status-detail">このチャットでお渡しする専用リンクを使ってください。</p></div>
      <button id="locked-retry" class="retry-button" hidden>もう一度確認する</button>
      <p class="locked-fine-print">専用リンクを知る人は記録を読めます。ほかの人に共有しないでください。</p>
      <a class="demo-link" href="?demo=1">架空データで画面を見る</a>
    </div>
  </section>
  <div id="workspace" class="paper" hidden>
    <aside id="demo-banner" class="demo-banner" hidden><span>架空データの画面例です</span><a href="./">自分の記録に戻る</a></aside>
    <header class="page-header">
      <h1 class="brand">LATTE<span aria-hidden="true">.</span></h1>
      <div class="update-area"><p id="last-updated"></p><button id="refresh" class="refresh-button" aria-label="最新の記録に更新する" title="最新の記録に更新する">↻</button></div>
    </header>
    <main id="main" tabindex="-1">
      <p id="workspace-notice" class="notice" role="status" aria-live="polite" hidden></p>
      <section id="section-new" class="record-section" aria-labelledby="title-new"><h2 id="title-new">新しい提案</h2><div id="list-new" class="record-list"></div></section>
      <section id="section-decision" class="record-section" aria-labelledby="title-decision"><h2 id="title-decision">判断待ち</h2><div id="list-decision" class="record-list"></div></section>
      <section id="section-deferred" class="record-section" aria-labelledby="title-deferred"><h2 id="title-deferred">保留中</h2><div id="list-deferred" class="record-list"></div></section>
      <section id="section-applied" class="record-section" aria-labelledby="title-applied"><h2 id="title-applied">応募中</h2><div id="list-applied" class="record-list"></div></section>
    </main>
    <footer class="page-footer"><button id="disconnect" class="quiet-button">この端末の接続を解除</button></footer>
  </div>
</body>
</html>
